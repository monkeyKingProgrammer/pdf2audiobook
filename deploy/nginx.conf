server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf2audiobook.weiwei.website;

    # Serve both HTTP and HTTPS at the origin. Cloudflare currently terminates
    # public TLS and reaches this origin over HTTP, so do not force a redirect.
    ssl_certificate /etc/letsencrypt/live/pdf2audiobook.weiwei.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf2audiobook.weiwei.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pdf2audiobook.weiwei.website;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8791/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Ubuntu 22.04's stock MIME table does not include ES module files.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
